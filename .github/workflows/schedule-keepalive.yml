name: Scheduled workflow keepalive

on:
  schedule:
    - cron: "17 9 1 * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    if: github.repository == 'pr0me/trmnl-apps' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Record monthly heartbeat
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/schedule-heartbeat
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/schedule-heartbeat
          git commit -m 'chore: keep scheduled workflows active'
          git push origin main
