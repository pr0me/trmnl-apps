name: The Berlin Times CI

on:
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/edition.yml
      - apps/berlin-times/**
      - Cargo.lock
      - Cargo.toml
      - ops/berlin-times/**
      - rustfmt.toml
  push:
    branches:
      - main
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/edition.yml
      - apps/berlin-times/**
      - Cargo.lock
      - Cargo.toml
      - ops/berlin-times/**
      - rustfmt.toml

permissions:
  contents: read

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Test edition dispatcher
        run: python3 -m unittest ops/berlin-times/test_dispatcher.py

      - name: Validate edition timers
        run: |
          systemd-analyze calendar '*-*-* 06:00:00 Europe/Berlin' >/dev/null
          systemd-analyze calendar '*-*-* 06:20:00 Europe/Berlin' >/dev/null
          systemd-analyze calendar '*-*-* 17:00:00 Europe/Berlin' >/dev/null
          systemd-analyze calendar '*-*-* 17:20:00 Europe/Berlin' >/dev/null

      - name: Generate fixture Pages artifact
        run: >-
          cargo run --locked --bin berlin-times -- generate
          --output _site
          --public-base-url https://example.com/trmnl-apps/
          --fixture apps/berlin-times/generator/fixtures/valid-research.json
          --fixture-image apps/berlin-times/generator/fixtures/lead.ppm
          --at 2026-08-05T04:15:00Z

      - name: Validate published interface
        run: |
          test "$(jq '.schema_version' _site/edition.json)" = "1"
          test "$(jq '.stories | length' _site/edition.json)" = "4"
          test "$(jq '.lead_image.story_id == .stories[0].id' _site/edition.json)" = "true"
          test "$(find _site/assets -maxdepth 1 -name 'lead-*.jpg' | wc -l)" = "1"

      - uses: actions/upload-artifact@v7
        with:
          name: fixture-pages
          path: _site

  plugin:
    name: Plugin render (${{ matrix.copy }})
    strategy:
      fail-fast: false
      matrix:
        copy:
          - short
          - typical
          - maximum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Prepare copy fixture
        env:
          COPY_VARIANT: ${{ matrix.copy }}
        run: |
          fixture=apps/berlin-times/generator/fixtures/valid-research.json
          if [[ "$COPY_VARIANT" = "typical" ]]; then
            cp "$fixture" /tmp/berlin-times-research.json
            exit 0
          fi
          jq --arg variant "$COPY_VARIANT" --slurpfile variants apps/berlin-times/plugin/test/copy-variants.json '
            .stories |= (to_entries | map(
              .value.headline = $variants[0][$variant].headlines[.key] |
              .value.summary = $variants[0][$variant].summaries[.key] |
              .value
            ))
          ' "$fixture" >/tmp/berlin-times-research.json

      - name: Generate local plugin assets
        run: >-
          cargo run --locked --bin berlin-times -- generate
          --output _site
          --public-base-url https://example.com/trmnl-apps/
          --fixture /tmp/berlin-times-research.json
          --fixture-image apps/berlin-times/generator/fixtures/lead.ppm
          --at 2026-08-05T04:15:00Z

      - name: Serve local plugin assets
        run: |
          nohup python3 apps/berlin-times/plugin/test/fixture_server.py _site --plugin-build apps/berlin-times/plugin/_build >/tmp/berlin-times-http.log 2>&1 &
          for _ in {1..20}; do
            if curl --fail --silent http://localhost:8000/edition.json >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/berlin-times-http.log
          exit 1

      - name: Lint TRMNL plugin
        run: >-
          docker run --rm
          -v "$PWD/apps/berlin-times/plugin:/plugin"
          trmnl/trmnlp:latest lint

      - name: Test production asset resolution
        run: >-
          docker run --rm
          --entrypoint /usr/local/bin/ruby
          -v "$PWD/apps/berlin-times/plugin:/plugin"
          trmnl/trmnlp:latest test/shared_test.rb

      - name: Render TRMNL X fixture
        run: >-
          docker run --rm
          --add-host=host.docker.internal:host-gateway
          -v "$PWD/apps/berlin-times/plugin:/plugin"
          trmnl/trmnlp:latest build --quiet --png
          --width 1872 --height 1404 --color-depth 4

      - name: Verify rendered layout
        env:
          COPY_VARIANT: ${{ matrix.copy }}
          LAYOUT_URL: http://host.docker.internal:8000/__plugin__/full.html
        run: >-
          docker run --rm
          --add-host=host.docker.internal:host-gateway
          -e COPY_VARIANT
          -e LAYOUT_URL
          --entrypoint /usr/local/bin/ruby
          -v "$PWD/apps/berlin-times/plugin:/plugin"
          trmnl/trmnlp:latest test/layout_test.rb

      - name: Verify render dimensions and palette
        run: |
          read -r width height colors <<< "$(docker run --rm --entrypoint magick -v "$PWD/apps/berlin-times/plugin/_build:/images" trmnl/trmnlp:latest identify -format '%w %h %k' /images/full.png)"
          test "$width" = "1872"
          test "$height" = "1404"
          test "$colors" -le 16

      - name: Make device render readable
        run: >-
          docker run --rm
          --entrypoint chmod
          -v "$PWD/apps/berlin-times/plugin/_build:/images"
          trmnl/trmnlp:latest 0644 /images/full.png

      - uses: actions/upload-artifact@v7
        with:
          name: berlin-times-render-${{ matrix.copy }}
          path: |
            apps/berlin-times/plugin/_build/full.png
            apps/berlin-times/plugin/_build/layout.png
            apps/berlin-times/plugin/test/golden/${{ matrix.copy }}.png
