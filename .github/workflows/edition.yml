name: Publish The Berlin Times edition

on:
  workflow_dispatch:
    inputs:
      edition_slot:
        description: Optional YYYY-MM-DD-morning or YYYY-MM-DD-evening publication slot
        required: false
        type: string

concurrency:
  group: berlin-times-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_BASE_URL: ${{ vars.BERLIN_TIMES_PUBLIC_BASE_URL }}
    outputs:
      publish: ${{ steps.edition-slot.outputs.publish }}
    steps:
      - name: Check edition slot
        id: edition-slot
        env:
          EDITION_SLOT: ${{ inputs.edition_slot }}
        run: |
          if [[ ! "$PUBLIC_BASE_URL" =~ ^https://[^[:space:]]+/$ ]]; then
            echo "BERLIN_TIMES_PUBLIC_BASE_URL must be an HTTPS URL ending in /" >&2
            exit 1
          fi

          if [[ -z "$EDITION_SLOT" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$EDITION_SLOT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-(morning|evening)$ ]]; then
            echo "invalid edition slot: $EDITION_SLOT" >&2
            exit 1
          fi

          current_edition="$(mktemp)"
          trap 'rm -f "$current_edition"' EXIT
          if ! curl --fail --silent --show-error --max-time 15 \
            "${PUBLIC_BASE_URL}edition.json" \
            --output "$current_edition"; then
            echo "published edition is unavailable; generating $EDITION_SLOT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! generated_at="$(jq --exit-status --raw-output '.generated_at' "$current_edition")" ||
            ! edition_name="$(jq --exit-status --raw-output '.edition_name' "$current_edition")" ||
            ! generated_date="$(TZ=Europe/Berlin date --date "$generated_at" +%F)"; then
            echo "published edition metadata is invalid; generating $EDITION_SLOT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current_slot="$generated_date-$edition_name"
          if [[ "$current_slot" == "$EDITION_SLOT" ]]; then
            echo "$EDITION_SLOT is already published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "published slot is $current_slot; generating $EDITION_SLOT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.edition-slot.outputs.publish == 'true'

      - uses: dtolnay/rust-toolchain@stable
        if: steps.edition-slot.outputs.publish == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.edition-slot.outputs.publish == 'true'

      - name: Verify generator
        if: steps.edition-slot.outputs.publish == 'true'
        run: cargo test --workspace --locked

      - name: Generate edition
        if: steps.edition-slot.outputs.publish == 'true'
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: |
          cargo run --locked --release --bin berlin-times -- generate \
          --output _site \
          --public-base-url "$PUBLIC_BASE_URL"

      - name: Verify generated edition slot
        if: steps.edition-slot.outputs.publish == 'true' && inputs.edition_slot != ''
        env:
          EDITION_SLOT: ${{ inputs.edition_slot }}
        run: |
          generated_at="$(jq --exit-status --raw-output '.generated_at' _site/edition.json)"
          edition_name="$(jq --exit-status --raw-output '.edition_name' _site/edition.json)"
          generated_date="$(TZ=Europe/Berlin date --date "$generated_at" +%F)"
          generated_slot="$generated_date-$edition_name"
          if [[ "$generated_slot" != "$EDITION_SLOT" ]]; then
            echo "generated slot $generated_slot does not match requested slot $EDITION_SLOT" >&2
            exit 1
          fi

      - uses: actions/configure-pages@v6
        if: steps.edition-slot.outputs.publish == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.edition-slot.outputs.publish == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
