---
strategy: plugin_merge
no_screen_padding: 'no'
dark_mode: 'no'
framework_version: 3.2.0
id: 410021
custom_fields:
- keyname: calendar_source
  name: Calendar data source
  field_type: plugin_instance_select
  plugin_keyname: google_calendar
  description: Select the hidden native Google Calendar instance.
  help_text: Only active Google Calendar instances are shown.
- keyname: dashboard_data_source
  name: Dashboard data source
  field_type: plugin_instance_select
  plugin_keyname: private_plugin
  description: Select the hidden Berlin Family Dashboard Data instance.
  help_text: Only active private plugin instances are shown.
- keyname: calendar_label
  name: Calendar label
  field_type: string
  description: Short heading shown above upcoming events.
  placeholder: Family
  maxlength: 48
name: Berlin Family Dashboard
description: Weather, calendar and BVG
refresh_interval: 15
