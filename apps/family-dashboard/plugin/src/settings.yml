---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.2.0
serverless_language: node
polling_url: 'https://www.googleapis.com/calendar/v3/calendars/{{ google_calendar_id | url_encode }}/events?singleEvents=true&orderBy=startTime&showDeleted=false&maxResults=250&timeMin={{ "now" | date: "%Y-%m-%dT%H:%M:%SZ" | url_encode }}&timeZone=Europe%2FBerlin'
polling_headers: 'Authorization=Bearer%20{{ oauth_access_token | url_encode }}'
polling_body: ''
id: 410021
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: google_calendar_id
  name: Google Calendar ID
  field_type: string
  description: Calendar ID from the Familie calendar's Integrate calendar settings.
  placeholder: family@example.com
name: Berlin Family Dashboard
description: Weather, calendar and BVG
refresh_interval: 15
