[workspace]
members = ["apps/berlin-times/generator"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0.98"
chrono = { version = "0.4.41", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.5.42", features = ["derive", "env"] }
futures-util = "0.3.31"
html-escape = "0.2.13"
httpdate = "1.0.3"
image = { version = "0.25.6", default-features = false, features = ["gif", "jpeg", "png", "pnm", "webp"] }
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls", "stream"] }
scraper = "0.23.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sha2 = "0.10.9"
tempfile = "3.20.0"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["fs", "macros", "net", "rt-multi-thread", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
url = { version = "2.5.4", features = ["serde"] }
wiremock = "0.6.4"
